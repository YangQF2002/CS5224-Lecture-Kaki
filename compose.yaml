services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - path: ./backend/.env.local
        required: false
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    volumes:
      # Output of backend/scripts/ingest_local.py; empty until it has run.
      - ./backend/out/ingest/lectures:/usr/share/nginx/html/lectures:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    init: true

  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      target: test
    init: true
