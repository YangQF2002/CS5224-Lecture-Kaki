worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Vite fingerprints these filenames; missing assets must return 404.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Compose mounts locally generated lecture data here; missing files must return 404.
        location /lectures/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Let React Router handle client-side routes after a direct navigation.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
