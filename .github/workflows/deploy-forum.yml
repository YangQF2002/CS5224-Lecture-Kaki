name: Deploy Forum storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forum-dev-storage
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Backend and frontend checks
        run: |
          docker compose build backend-test frontend-test
          docker compose run --rm backend-test
          docker compose run --rm frontend-test
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: forum-dev
    permissions:
      contents: read
      id-token: write
    env:
      # The shared dev table already exists; explicitly configure it to prevent duplication.
      EXISTING_TABLE: ${{ vars.FORUM_EXISTING_TABLE_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check shared table configuration
        run: test -n "$EXISTING_TABLE"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Deploy storage definition
        run: aws cloudformation deploy --template-file infra/forum.yaml --stack-name lecturekaki-forum-dev --parameter-overrides "Env=dev" "ExistingTableName=$EXISTING_TABLE" --no-fail-on-empty-changeset
