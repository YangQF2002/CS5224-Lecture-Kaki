name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry install --with dev --no-interaction --no-ansi
      - name: Lint, check formatting, and run backend tests
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint, check formatting, check types, and build frontend
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run build

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate CloudFormation templates
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/python" -m pip install cfn-lint==1.57.2
          # Local Lambda paths are resolved during packaging.
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" --template infra/auth.yaml infra/timetable.yaml --regions ap-southeast-1 --ignore-checks W3002
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check Terraform formatting and configuration
        run: |
          terraform fmt -check -recursive infra/terraform
          # validate only needs the Lambda packages to exist; deploys build the real ones.
          mkdir -p build && touch build/ingest.zip build/api.zip
          for dir in infra/terraform infra/terraform/bootstrap infra/terraform/github; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
