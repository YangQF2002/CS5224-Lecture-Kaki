name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  containers:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: lecture-kaki-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate CloudFormation templates
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/python" -m pip install cfn-lint==1.57.2
          # Local Lambda paths are resolved during packaging.
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" --template infra/auth.yaml infra/template.yaml --regions ap-southeast-1 --ignore-checks W3002
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build runtime and test images
        run: docker compose --profile test build --pull
      - name: Backend checks in container
        run: docker compose run --rm backend-test
      - name: Frontend checks in container
        run: docker compose run --rm frontend-test
      - name: Start runtime containers
        run: docker compose up --detach --wait --wait-timeout 90
      - name: Smoke test runtime images
        run: python3 scripts/smoke_test.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
