name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build backend test image
        run: docker compose build --pull backend-test
      - name: Lint, check formatting, and run backend tests
        run: docker compose run --rm backend-test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build frontend test image
        run: docker compose build --pull frontend-test
      - name: Lint, check formatting, check types, and build frontend
        run: docker compose run --rm frontend-test

  containers:
    name: Docker and infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: lecture-kaki-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate CloudFormation templates
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/python" -m pip install cfn-lint==1.57.2
          # Local Lambda paths are resolved during packaging.
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" --template infra/auth.yaml infra/hosting.yaml infra/ingest.yaml infra/timetable.yaml --regions ap-southeast-1 --ignore-checks W3002
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check Terraform formatting and configuration
        run: |
          terraform fmt -check -recursive infra/terraform
          # validate only needs the ingestion package to exist; deploys build the real one.
          mkdir -p build && touch build/ingest.zip
          for dir in infra/terraform infra/terraform/bootstrap infra/terraform/github; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build runtime images
        run: docker compose build --pull backend frontend
      - name: Start runtime containers
        run: docker compose up --detach --wait --wait-timeout 90
      - name: Smoke test runtime images
        run: python3 scripts/smoke_test.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
