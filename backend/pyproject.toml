[project]
name = "lecture-kaki-backend"
version = "0.0.0"
description = "LectureKaki API"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi (>=0.143.0,<0.144.0)", "uvicorn (>=0.54.0,<0.55.0)", "pyjwt[crypto] (>=2.15.1,<3.0.0)"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not cognito'"
markers = ["cognito: opt-in tests against the development Cognito pool"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]
