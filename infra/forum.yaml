AWSTemplateFormatVersion: "2010-09-09"
Description: Forum storage and access permissions using the existing DynamoDB table and private PDF storage.

Parameters:
  PdfBucketName:
    Type: String
    Default: lecturekaki-forum
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "[a-z0-9][a-z0-9.-]+[a-z0-9]"
    Description: Globally unique private bucket name; use a different name for another environment.
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  FrontendOrigins:
    Type: CommaDelimitedList
    Description: Exact website origins allowed to upload PDFs (include local origins when needed).
    Default: "http://localhost:5173,http://localhost:8080"
  ForumTableName:
    Type: String
    Default: lecturekaki-dev-forum
    Description: Existing Forum table with String PK/SK and TTL on ttl; this stack does not recreate it.
  CreateRuntimePolicy:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Optionally create a policy for the account owner to attach to the API role.

Conditions:
  RuntimePolicyEnabled: !Equals [!Ref CreateRuntimePolicy, "true"]

Resources:
  PdfBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref PdfBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "lecture-kaki-${Env}-forum-pdfs"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref FrontendOrigins
            AllowedMethods: [PUT]
            AllowedHeaders: ["Content-Type", "If-None-Match"]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAndVersions
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: RemoveDeleteMarkers
            Status: Enabled
            Prefix: uploads/
            ExpiredObjectDeleteMarker: true

  PdfBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PdfBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt PdfBucket.Arn, !Sub "${PdfBucket.Arn}/*"]
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: RequireConditionalUploads
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${PdfBucket.Arn}/uploads/*"
            Condition:
              "Null":
                s3:if-none-match: true

  ForumRuntimePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: RuntimePolicyEnabled
    Properties:
      Description: Forum messages, connection tickets and PDFs; attach to the shared API runtime role and approved developers.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObjectVersion
              - s3:GetObject
              - s3:DeleteObjectVersion
            Resource: !Sub "${PdfBucket.Arn}/uploads/*"
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt PdfBucket.Arn
            Condition:
              StringLike:
                s3:prefix: ["uploads/*"]
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:DeleteItem
              - dynamodb:UpdateItem
            Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ForumTableName}"

Outputs:
  ForumTableName:
    Value: !Ref ForumTableName
  PdfBucketName:
    Value: !Ref PdfBucket
  RuntimePolicyArn:
    Condition: RuntimePolicyEnabled
    Value: !Ref ForumRuntimePolicy
